<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="keys">
            <button id="clear">AC</button>
            <button id="plus-minus">+/- </button>
            <button id="percentage">%</button>
            <button class="operation">/</button>
            <button class="num main">7</button>
            <button class="num main">8</button>
            <button class="num main">9</button>
            <button class="operation">*</button>
            <button class="num main">4</button>
            <button class="num main">5</button>
            <button class="num main">6</button>
            <button class="operation">-</button>
            <button class="num main">1</button>
            <button class="num main">2</button>
            <button class="num main">3</button>
            <button class="operation">+</button>
            <button class="helper-btn"></button>
            <button class="num main">0</button>
            <button class="main" id="comma">.</button>
            <button id="equals">=</button>
        </div>
    </div>
</body>
</html>
